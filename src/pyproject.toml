# Set Poetry as the build-backend tool
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Project metadata
[tool.poetry]
name = "rag-documents-qa"
version = "0.1.0"
description = "RAG pipeline for document QA using LLMs and vector databases"
authors = ["Francisco José Morón Reyes <fcojmoronreyes@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
package-mode = false

# Core dependencies (empty for now)
[tool.poetry.dependencies]
python = ">=3.11.9,<3.13"

# Development tools
dotenv = "^0.9.9"
transformers = "^4.56.1"
langchain-text-splitters = "^0.3.11"
langchain-community = "^0.3.29"
langchain-core = "^0.3.76"
pypdf = "^6.0.0"
torch = "^2.8.0"
[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
mypy = "^1.15.0"
ruff = "^0.6.0"
safety = "^3.2.0"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
env_files = [".env"]
markers = [
    "unit: unit tests",
    "integration: integration tests"
]
